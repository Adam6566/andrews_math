<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Test-conditions math practice for 3rd graders: draw the array from the word problem, one attempt per step.">
<meta name="color-scheme" content="light dark">
<title>Unit Ranger</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* ================= TOKENS ================= */
:root{
  --paper:#EDF0E9; --paper-2:#E2E7DD; --card:#FBFCF8;
  --ink:#16261E; --muted:#5D6D62; --line:#C9D3C6;
  --pine:#1F5C46; --pine-soft:#DCEBE1;
  --brass:#B57F13; --brass-soft:#F6E7C2;
  --berry:#A8324A; --berry-soft:#F7DEE2;
  --sky:#2E6E8E;
  --on-accent:#FBFCF8;
  --shadow:0 1px 0 rgba(22,38,30,.06), 0 8px 22px -14px rgba(22,38,30,.45);
  --r-s:6px; --r-m:12px; --r-l:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1512; --paper-2:#121D18; --card:#16231D;
    --ink:#E6EFE8; --muted:#93A79A; --line:#2A3B33;
    --pine:#57C598; --pine-soft:#183A2C;
    --brass:#E8B23F; --brass-soft:#3A2E12;
    --berry:#F0879C; --berry-soft:#3B1B22;
    --sky:#78BEDD;
    --on-accent:#0D1512;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1512; --paper-2:#121D18; --card:#16231D;
  --ink:#E6EFE8; --muted:#93A79A; --line:#2A3B33;
  --pine:#57C598; --pine-soft:#183A2C;
  --brass:#E8B23F; --brass-soft:#3A2E12;
  --berry:#F0879C; --berry-soft:#3B1B22;
  --sky:#78BEDD;
  --on-accent:#0D1512;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;margin:0;text-wrap:balance;line-height:1.1}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:4px}
.wrap{max-width:1060px;margin:0 auto;padding:20px 18px 72px}

/* ================= HEADER ================= */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 18px;border-bottom:2px solid var(--line);margin-bottom:26px}
.crest{width:46px;height:46px;flex:0 0 auto}
.brand h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em}
.brand .sub{font-size:13px;color:var(--muted);margin-top:2px}
.top .spacer{flex:1 1 auto}
.tally{display:flex;align-items:center;gap:8px;background:var(--brass-soft);border:1px solid var(--brass);border-radius:999px;padding:7px 14px}
.tally .n{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.ghost:hover{border-color:var(--muted);color:var(--ink)}

/* ================= MAP ================= */
.mapwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);padding:6px;margin-bottom:12px;overflow-x:auto}
.mapinner{position:relative;min-width:780px;height:250px}
.mapinner svg.trail{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;color:var(--muted);transition:transform .18s ease,border-color .18s}
.node:hover{transform:translate(-50%,-50%) scale(1.08);border-color:var(--pine);color:var(--pine)}
.node.done{border-color:var(--brass);background:var(--brass-soft);color:var(--ink)}
.node .pips{position:absolute;bottom:-16px;display:flex;gap:2px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--brass)}
.maplabel{position:absolute;transform:translate(-50%,0);white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;margin-top:22px}
.station{text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mod,var(--pine));border-radius:var(--r-m);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;transition:transform .16s ease,box-shadow .16s ease}
.station:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.station .num{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;color:var(--mod,var(--pine));font-weight:600}
.station h3{font-size:19px;font-weight:700}
.station p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.station .foot{margin-top:8px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.stars{letter-spacing:2px;color:var(--brass);font-size:15px}
.stars .off{color:var(--line)}
.best{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}

/* ================= QUIZ SHELL ================= */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);padding:22px;max-width:760px;margin:0 auto}
.qhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.qhead .mod{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mod,var(--pine));font-weight:600}
.qhead .spacer{flex:1}
.streak{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--brass)}
.track{display:flex;gap:5px;margin:10px 0 18px}
.tick{height:6px;flex:1;border-radius:99px;background:var(--line)}
.tick.hit{background:var(--pine)} .tick.miss{background:var(--berry)} .tick.now{background:var(--brass)}

.context{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(19px,3.2vw,23px);font-weight:700;line-height:1.4;margin-bottom:16px}
.stepbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stepchip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.stepchip.on{border-color:var(--brass);background:var(--brass-soft);color:var(--ink)}
.stepchip.ok{border-color:var(--pine);background:var(--pine-soft);color:var(--ink)}

.done-step{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin-bottom:12px;background:var(--paper-2);border-radius:var(--r-m);border-left:3px solid var(--pine)}
.done-step.bad{border-left-color:var(--berry)}
.done-step .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);flex:0 0 auto;padding-top:3px}
.done-step .val{font-weight:600}
.done-step .mini{margin-top:6px}

.instruct{font-size:17px;font-weight:600;margin-bottom:4px}
.hintline{font-size:14.5px;color:var(--muted);margin-bottom:14px}

/* ================= ARRAY BUILDER ================= */
.builder{background:var(--paper-2);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.abgrid{
  display:grid;gap:3px;touch-action:none;user-select:none;-webkit-user-select:none;
  padding:6px;background:var(--card);border-radius:8px;border:1px solid var(--line);
}
.abgrid .cell{
  width:var(--cs,28px);height:var(--cs,28px);padding:0;border-radius:5px;
  border:1px dashed var(--line);background:transparent;display:grid;place-items:center;
  transition:background .08s,border-color .08s;
}
.abgrid .cell span{width:60%;height:60%;border-radius:50%;background:transparent;transition:background .08s}
.abgrid .cell.on{border:1px solid var(--pine);background:var(--pine-soft)}
.abgrid .cell.on span{background:var(--pine)}
.abgrid .cell.over{border:1px solid var(--berry);background:var(--berry-soft)}
.abgrid .cell.over span{background:var(--berry)}
.abgrid .cell.locked{border-style:solid;border-color:var(--brass);opacity:.9}
.abgrid.ro .cell{cursor:default}

.dims{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.dim{display:flex;align-items:center;gap:6px}
.dim .cap{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dim .stepbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;display:grid;place-items:center}
.dim .stepbtn:hover:not(:disabled){border-color:var(--pine)}
.dim .stepbtn:disabled{opacity:.35;cursor:not-allowed}
.dim .num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:19px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.dim.locked .num{color:var(--brass)}

.readout{
  font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;text-align:center;
  padding:10px 18px;border-radius:var(--r-m);border:2px solid var(--line);background:var(--card);
  font-variant-numeric:tabular-nums;min-width:min(100%,300px);
}
.readout .status{display:block;font-family:"Source Sans 3",sans-serif;font-size:14px;font-weight:400;margin-top:3px}
.readout.good{border-color:var(--pine);background:var(--pine-soft)}
.readout.under{border-color:var(--brass);background:var(--brass-soft)}
.readout.over{border-color:var(--berry);background:var(--berry-soft)}

/* ================= TAPE BUILDER ================= */
.tape{width:100%;max-width:460px}
.tape .brace{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);margin-bottom:2px}
.tape .bar{display:flex;width:100%;height:52px;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.tape .seg{flex:1;border-right:2px solid var(--ink);display:grid;place-items:center;background:var(--pine-soft);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;color:var(--ink)}
.tape .seg:last-child{border-right:none}
.tape .seg.hit{background:var(--pine);color:var(--on-accent)}
.tape .cap{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-top:6px}

/* ================= DISKS ================= */
.disks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dcol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px}
.dcol .cap{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;color:var(--muted)}
.dcol .well{min-height:78px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;width:100%}
.disk{width:19px;height:19px;border-radius:50%}
.dcol .ctl{display:flex;gap:4px}
.dcol .ctl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--paper-2);font-size:15px;line-height:1;display:grid;place-items:center}
.dcol .ctl button:hover:not(:disabled){border-color:var(--pine)}
.dcol .ctl button:disabled{opacity:.35;cursor:not-allowed}

/* ================= FRACTION BAR ================= */
.fbar{display:flex;width:100%;max-width:440px;height:56px;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.fbar .fseg{flex:1;border-right:2px solid var(--ink);background:var(--card);transition:background .1s}
.fbar .fseg:last-child{border-right:none}
.fbar .fseg.sh{background:var(--pine)}
.fbar.ro .fseg{cursor:default}

/* ================= NUMBER LINE ================= */
.nlwrap{width:100%;max-width:470px;touch-action:none}
.nlwrap svg{width:100%;height:auto;display:block}
.figure{display:flex;justify-content:center;padding:14px 6px;margin-bottom:16px;background:var(--paper-2);border-radius:var(--r-m);overflow-x:auto}
.figure svg{max-width:100%;height:auto}

/* ================= ANSWER INPUTS ================= */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:540px){.choices{grid-template-columns:1fr}}
.choice{display:flex;align-items:center;gap:11px;text-align:left;background:var(--paper-2);border:2px solid transparent;border-radius:var(--r-m);padding:13px 15px;font-size:19px;font-weight:600;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--pine)}
.choice:disabled{cursor:default}
.choice .key{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;width:22px;height:22px;flex:0 0 auto;border-radius:5px;background:var(--card);color:var(--muted);display:grid;place-items:center}
.choice.right{border-color:var(--pine);background:var(--pine-soft)}
.choice.wrong{border-color:var(--berry);background:var(--berry-soft)}

.entry{display:flex;flex-direction:column;align-items:center;gap:14px}
.numout{font-family:"IBM Plex Mono",monospace;font-size:32px;font-weight:600;min-width:170px;text-align:center;padding:6px 16px;border-radius:var(--r-m);background:var(--paper-2);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.numout.right{border-color:var(--pine);background:var(--pine-soft)}
.numout.wrong{border-color:var(--berry);background:var(--berry-soft)}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:8px}
.pad button{height:50px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--paper-2);font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600}
.pad button:hover{border-color:var(--pine)}
.pad button.go{background:var(--pine);color:var(--on-accent);border-color:var(--pine);font-family:"Source Sans 3",sans-serif;font-size:15px;font-weight:700}

.btn{background:var(--pine);color:var(--on-accent);border:none;border-radius:999px;padding:11px 24px;font-weight:700;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn.wide{width:100%;max-width:300px}
.rowend{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}

.feedback{margin-top:16px;padding:14px 16px;border-radius:var(--r-m);border-left:4px solid var(--pine);background:var(--pine-soft);font-size:15.5px}
.feedback.no{border-left-color:var(--berry);background:var(--berry-soft)}
.feedback strong{font-family:"Bricolage Grotesque",sans-serif;display:block;font-size:17px;margin-bottom:2px}

/* ================= RESULTS ================= */
.stamp{width:150px;height:150px;margin:0 auto 6px;display:grid;place-items:center;animation:thud .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes thud{from{transform:scale(2.1) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none;transform:rotate(-6deg)}}
.bigstars{text-align:center;font-size:36px;letter-spacing:6px;color:var(--brass);margin:4px 0 2px}
.bigstars .off{color:var(--line)}
.notes{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.note{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.note:last-child{border-bottom:none}
.note .mk{color:var(--berry);font-weight:700;font-family:"IBM Plex Mono",monospace;flex:0 0 auto}
.note .body{color:var(--muted);line-height:1.85}
.note .body b{color:var(--ink);font-weight:600}

.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:-.45em;margin:0 2px;font-family:"IBM Plex Mono",monospace}
.frac .n{font-size:.72em;padding:0 3px}
.frac .d{font-size:.72em;padding:0 3px;border-top:2px solid currentColor;margin-top:2px}
footer{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <svg class="crest" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 3l17 6v14c0 11-7.4 18.6-17 22C14.4 41.6 7 34 7 23V9z" fill="var(--pine-soft)" stroke="var(--pine)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M24 12l4.2 8.6 9.4 1.3-6.8 6.6 1.6 9.4-8.4-4.5-8.4 4.5 1.6-9.4-6.8-6.6 9.4-1.3z" fill="var(--brass)"/>
    </svg>
    <div class="brand">
      <h1>Unit Ranger</h1>
      <div class="sub">Grade 3 field expedition &middot; Eureka Math<sup>2</sup> Modules 1&ndash;6</div>
    </div>
    <div class="spacer"></div>
    <div class="tally"><span aria-hidden="true">&#9733;</span><span class="n"><span id="totstars">0</span>/18</span> <span style="font-size:13px">stars earned</span></div>
    <button class="ghost" id="resetbtn" type="button">Reset trail</button>
  </header>
  <main id="view"></main>
  <footer>Test conditions: one attempt per step, no hints while you work. The drawing comes first.</footer>
</div>

<script>
/* ============================================================
   UNIT RANGER  —  Eureka Math² Grade 3
   Build-then-solve: every question starts by constructing a
   representation, then reasons from it.
   ============================================================ */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const frac=(n,d)=>`<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const plural=(n,s)=>n===1?s:s+'s';

function mc(correct,pool){
  const out=[correct];
  for(const v of shuffle(pool)){ if(out.length>=4)break; if(Number.isInteger(v)&&v>=0&&!out.includes(v))out.push(v); }
  let g=0; while(out.length<4&&g++<80){const j=correct+R(1,9)*pick([1,-1]); if(j>=0&&!out.includes(j))out.push(j);}
  while(out.length<4)out.push(Math.max(...out)+1);
  const arr=shuffle(out);
  return {choices:arr.map(String),answer:arr.indexOf(correct)};
}
function mcText(correct,wrongs){
  const arr=shuffle([correct,...wrongs]);
  return {choices:arr,answer:arr.indexOf(correct)};
}

/* ============================================================
   STEP KINDS
   Each step object describes one thing the student does.
     {kind:'array',  need:{rows,cols,total}, lock:{rows|cols}, max:{r,c}}
     {kind:'tape',   total, need:{parts}, showPart:bool, partLabel}
     {kind:'disks',  need:{value}}
     {kind:'frac',   need:{d,n}}
     {kind:'nline',  min,max,step, need:{v}}
     {kind:'choice', choices, answer}
     {kind:'input',  ans}
   Every step carries: instruct, hint, recap (how it shows once done)
   ============================================================ */

/* ---------- shared state for the live builder ---------- */
let B = null;   // current builder state

/* ================= ARRAY BUILDER ================= */
function arrayBuilderHTML(st){
  const maxR=st.max?.r??10, maxC=st.max?.c??10;
  const cs = maxC>10 ? 24 : 28;
  let cells='';
  for(let r=0;r<maxR;r++) for(let c=0;c<maxC;c++)
    cells+=`<button class="cell" type="button" data-r="${r}" data-c="${c}" tabindex="-1" aria-hidden="true"><span></span></button>`;
  const lockR=st.lock?.rows!==undefined, lockC=st.lock?.cols!==undefined;
  return `<div class="builder">
    <div class="abgrid" id="abgrid" style="grid-template-columns:repeat(${maxC},var(--cs));--cs:${cs}px"
         role="application" aria-label="Array builder. Use the row and column buttons, or drag across the grid.">${cells}</div>
    <div class="dims">
      <div class="dim ${lockR?'locked':''}">
        <span class="cap">Rows</span>
        <button class="stepbtn" type="button" data-adj="r-1" ${lockR?'disabled':''} aria-label="One fewer row">&minus;</button>
        <span class="num" id="abr">0</span>
        <button class="stepbtn" type="button" data-adj="r1" ${lockR?'disabled':''} aria-label="One more row">+</button>
      </div>
      <div class="dim ${lockC?'locked':''}">
        <span class="cap">In each row</span>
        <button class="stepbtn" type="button" data-adj="c-1" ${lockC?'disabled':''} aria-label="One fewer in each row">&minus;</button>
        <span class="num" id="abc">0</span>
        <button class="stepbtn" type="button" data-adj="c1" ${lockC?'disabled':''} aria-label="One more in each row">+</button>
      </div>
    </div>
    <div class="readout" id="abread" role="status" aria-live="polite">&nbsp;</div>
  </div>`;
}

function arrayPaint(){
  const grid=document.getElementById('abgrid');
  if(!grid) return;
  const {rows,cols}=B;
  grid.querySelectorAll('.cell').forEach(el=>{
    const r=+el.dataset.r, c=+el.dataset.c;
    el.className='cell'+((r<rows&&c<cols)?' on':'');
  });
  document.getElementById('abr').textContent=rows;
  document.getElementById('abc').textContent=cols;
  const ro=document.getElementById('abread');
  ro.className='readout';
  ro.innerHTML = (rows&&cols)
    ? `${rows} ${plural(rows,'row')} of ${cols}<span class="status">Press Check when your drawing is finished.</span>`
    : `<span style="font-size:15px">Nothing drawn yet</span><span class="status">Drag across the grid, or use the + buttons.</span>`;
}

function arraySet(r,c){
  const st=B.step, maxR=st.max?.r??10, maxC=st.max?.c??10;
  if(st.lock?.rows===undefined) B.rows=Math.max(0,Math.min(maxR,r));
  if(st.lock?.cols===undefined) B.cols=Math.max(0,Math.min(maxC,c));
  arrayPaint();
}

function arrayWire(){
  const grid=document.getElementById('abgrid');
  let dragging=false;
  const fromPoint=(x,y)=>{
    const el=document.elementFromPoint(x,y);
    const cell=el&&el.closest?el.closest('.cell'):null;
    if(cell&&grid.contains(cell)) arraySet(+cell.dataset.r+1,+cell.dataset.c+1);
  };
  grid.addEventListener('pointerdown',e=>{
    dragging=true; grid.setPointerCapture(e.pointerId); fromPoint(e.clientX,e.clientY); e.preventDefault();
  });
  grid.addEventListener('pointermove',e=>{ if(dragging) fromPoint(e.clientX,e.clientY); });
  const stop=()=>{dragging=false;};
  grid.addEventListener('pointerup',stop); grid.addEventListener('pointercancel',stop);
  document.querySelectorAll('[data-adj]').forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.adj, d=+a.slice(1);
    if(a[0]==='r') arraySet(B.rows+d, B.cols||1); else arraySet(B.rows||1, B.cols+d);
  }));
}

function arrayMini(rows,cols,total){
  const cs=11; let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const over = total!==undefined && (r*cols+c)>=total;
    cells+=`<span style="width:${cs}px;height:${cs}px;border-radius:50%;background:${over?'var(--berry)':'var(--pine)'}"></span>`;
  }
  return `<div class="mini" style="display:grid;grid-template-columns:repeat(${cols},${cs}px);gap:3px">${cells}</div>`;
}

/* ================= NUMBER LINE ================= */
function nlineHTML(st){
  return `<div class="builder">
    <div class="nlwrap" id="nlw">${nlineSVG(st,null)}</div>
    <div class="readout" id="nlread" role="status" aria-live="polite">&nbsp;</div>
    <div class="hintline" style="margin:0">Tap the line where the number belongs.</div>
  </div>`;
}
function nlineSVG(st,v,locked){
  const W=460,H=96,pad=38, span=st.max-st.min;
  const sx=x=>pad+((x-st.min)/span)*(W-pad*2);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="number line from ${st.min} to ${st.max}">`;
  s+=`<line x1="${pad}" y1="52" x2="${W-pad}" y2="52" stroke="var(--ink)" stroke-width="2.5"/>`;
  for(let t=st.min;t<=st.max+1e-9;t+=st.step){
    const x=sx(t), major=st.majors?st.majors.includes(+t.toFixed(6)):false;
    s+=`<line x1="${x}" y1="46" x2="${x}" y2="58" stroke="var(--ink)" stroke-width="${major?2.4:1.2}" opacity="${major?1:.5}"/>`;
  }
  s+=`<text x="${pad}" y="78" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-size="13" text-anchor="middle">${st.labMin??st.min}</text>`;
  s+=`<text x="${W-pad}" y="78" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-size="13" text-anchor="middle">${st.labMax??st.max}</text>`;
  if(st.mid!==undefined) s+=`<line x1="${sx(st.mid)}" y1="40" x2="${sx(st.mid)}" y2="64" stroke="var(--brass)" stroke-width="2" stroke-dasharray="3 3"/>`;
  if(v!==null&&v!==undefined){
    const x=sx(v), col=locked?'var(--pine)':'var(--brass)';
    s+=`<circle cx="${x}" cy="52" r="8" fill="${col}" stroke="var(--card)" stroke-width="2.5"/>`;
    s+=`<text x="${x}" y="28" fill="${col}" font-family="IBM Plex Mono,monospace" font-weight="600" font-size="15" text-anchor="middle">${st.fmt?st.fmt(v):v}</text>`;
  }
  return s+'</svg>';
}
function nlinePaint(){
  const st=B.step;
  document.getElementById('nlw').innerHTML=nlineSVG(st,B.v);
  const ro=document.getElementById('nlread');
  ro.className='readout';
  ro.innerHTML=(B.v===null?'Nothing placed yet':'Mark placed')
    +`<span class="status">Press Check when your mark is where you want it.</span>`;
}

function nlineWire(){
  const w=document.getElementById('nlw'), st=B.step;
  const place=e=>{
    const svg=w.querySelector('svg'), r=svg.getBoundingClientRect();
    const W=460,pad=38, span=st.max-st.min;
    const px=((e.clientX-r.left)/r.width)*W;
    let val=st.min+((px-pad)/(W-pad*2))*span;
    val=Math.round(val/st.step)*st.step;
    val=Math.max(st.min,Math.min(st.max,+val.toFixed(6)));
    B.v=val; nlinePaint();
  };
  w.addEventListener('pointerdown',e=>{place(e); e.preventDefault();});
}

function clockFig(hh,mm){
  const cx=90,cy=90,r=72;
  let s=`<svg viewBox="0 0 180 180" width="190" role="img" aria-label="analog clock face">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>`;
  for(let i=0;i<60;i++){
    const a=(i/60)*Math.PI*2-Math.PI/2,big=i%5===0,r1=r-(big?11:5),r2=r-2;
    s+=`<line x1="${cx+Math.cos(a)*r1}" y1="${cy+Math.sin(a)*r1}" x2="${cx+Math.cos(a)*r2}" y2="${cy+Math.sin(a)*r2}" stroke="${big?'var(--ink)':'var(--muted)'}" stroke-width="${big?2.4:1}"/>`;
  }
  for(let n=1;n<=12;n++){
    const a=(n/12)*Math.PI*2-Math.PI/2;
    s+=`<text x="${cx+Math.cos(a)*(r-24)}" y="${cy+Math.sin(a)*(r-24)+5}" fill="var(--ink)" font-family="IBM Plex Mono,monospace" font-size="13" text-anchor="middle">${n}</text>`;
  }
  const ma=(mm/60)*Math.PI*2-Math.PI/2, ha=(((hh%12)+mm/60)/12)*Math.PI*2-Math.PI/2;
  s+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(ha)*(r-36)}" y2="${cy+Math.sin(ha)*(r-36)}" stroke="var(--pine)" stroke-width="7" stroke-linecap="round"/>`;
  s+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(ma)*(r-14)}" y2="${cy+Math.sin(ma)*(r-14)}" stroke="var(--brass)" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="5" fill="var(--ink)"/></svg>`;
  return s;
}
function barGraphFig(cats,vals,scale,unit){
  const w=430,h=210,pad=46,base=h-38,top=Math.ceil(Math.max(...vals)/scale)*scale;
  const bw=(w-pad-20)/cats.length;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="bar graph of ${unit}">`;
  for(let v=0;v<=top;v+=scale){
    const y=base-(v/top)*(base-24);
    s+=`<line x1="${pad}" y1="${y}" x2="${w-8}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${pad-8}" y="${y+4}" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-size="11" text-anchor="end">${v}</text>`;
  }
  cats.forEach((c,i)=>{
    const bh=(vals[i]/top)*(base-24),x=pad+i*bw+bw*0.18;
    s+=`<rect x="${x}" y="${base-bh}" width="${bw*0.64}" height="${bh}" fill="${i%2?'var(--sky)':'var(--pine)'}" rx="2"/>`;
    s+=`<text x="${x+bw*0.32}" y="${base+16}" fill="var(--ink)" font-family="IBM Plex Mono,monospace" font-size="11.5" text-anchor="middle">${c}</text>`;
  });
  s+=`<line x1="${pad}" y1="${base}" x2="${w-8}" y2="${base}" stroke="var(--ink)" stroke-width="2"/>`;
  s+=`<text x="${pad-8}" y="18" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-size="10.5" text-anchor="end">${unit}</text></svg>`;
  return s;
}

/* ---- the correct build, revealed only after the student commits ---- */
function solutionOf(st){
  if(st.kind==='array'){
    const n=st.need; let r=n.rows,c=n.cols;
    if(r===undefined&&c!==undefined) r=n.total/c;
    if(c===undefined&&r!==undefined) c=n.total/r;
    if(r===undefined&&c===undefined){ r=1;c=n.total;
      for(let x=1;x<=(st.max?.r??10);x++) if(n.total%x===0&&n.total/x<=(st.max?.c??10)){r=x;c=n.total/x;break;} }
    return {text:`${r} ${plural(r,'row')} of ${c} = ${r*c}`, mini:arrayMini(r,c)};
  }
  if(st.kind==='tape')  return {text:`${st.need.parts} equal ${plural(st.need.parts,'part')} of ${st.total/st.need.parts}`, mini:tapeMini(st.total,st.need.parts,true)};
  if(st.kind==='disks') return {text:`${st.need.value.toLocaleString()}`, mini:''};
  if(st.kind==='frac')  return {text:`${st.need.n} of ${st.need.d} parts shaded`, mini:fracMini(st.need.d,st.need.n)};
  if(st.kind==='nline') return {text:`${st.fmt?st.fmt(st.need.v):st.need.v}`, mini:`<div class="mini" style="max-width:260px">${nlineSVG(st,st.need.v,true)}</div>`};
  return {text:'',mini:''};
}

      {kind:'input',instruct:'What is the number?',ans:val}
    ],why:`${extraTens} tens is more than 9, so regroup: ${extraTens} tens = ${Math.floor(extraTens/10)} hundred and ${extraTens%10} tens. That makes ${th} thousands, ${h+Math.floor(extraTens/10)} hundreds, ${extraTens%10} tens, ${o} ones = ${val.toLocaleString()}.`};},

  ()=>{const n=R(21,78)*10+R(1,9),lo=Math.floor(n/100)*100,hi=lo+100;
    const ansH=(n-lo>=50)?hi:lo, ansT=Math.round(n/10)*10;
    return{q:`Round ${n} two different ways.`,steps:[
      {kind:'nline',instruct:`Place ${n} on the number line, using the closest tick.`,
       min:lo,max:hi,step:10,majors:[lo,hi],mid:lo+50,need:{v:Math.round(n/10)*10}},
      {kind:'input',instruct:`Round ${n} to the nearest ten.`,ans:ansT},
      {kind:'input',instruct:`Now round ${n} to the nearest hundred.`,ans:ansH}
    ],why:`To the nearest ten, ${n} → ${ansT}. To the nearest hundred, ${n} sits between ${lo} and ${hi} with a halfway point of ${lo+50}, so it rounds to ${ansH}. Rounding to a different place can give a different answer.`};},

  ()=>{const L=pick([2,3,4]),drank=pick([250,350,450,750]);
    return{q:`A pitcher holds ${L} liters of water. Someone pours out ${drank} milliliters.`,steps:[
      {kind:'input',instruct:`How many milliliters does the pitcher hold? (1 L = 1,000 mL)`,ans:L*1000},
      {kind:'input',instruct:'How many milliliters are left in the pitcher?',ans:L*1000-drank}
    ],why:`${L} L = ${L*1000} mL. Then ${L*1000} − ${drank} = ${L*1000-drank} mL left. You have to convert to the same unit before subtracting.`};},

  ()=>{const kg=pick([3,4,5]),bagG=pick([250,400,500]);
    const bags=Math.floor(kg*1000/bagG);
    return{q:`A ${kg} kilogram sack of flour is split into bags holding ${bagG} grams each.`,steps:[
      {kind:'input',instruct:'How many grams of flour are in the sack? (1 kg = 1,000 g)',ans:kg*1000},
      {kind:'input',instruct:`How many full ${bagG} gram bags can be filled?`,ans:bags}
    ],why:`${kg} kg = ${kg*1000} g. Then ${kg*1000} ÷ ${bagG} = ${bags} bags.`};},

  ()=>{const a=R(3,7)*100+R(21,89),b=R(1,3)*100+R(21,89),c=R(50,180);
    return{q:`A library had ${a} books. ${b} more were donated, then ${c} were given away.`,steps:[
      {kind:'input',instruct:`How many books after the donation? ${a} + ${b} = ?`,ans:a+b},
      {kind:'input',instruct:`And after giving ${c} away?`,ans:a+b-c}
    ],why:`${a} + ${b} = ${a+b}, then ${a+b} − ${c} = ${a+b-c} books.`};},

  ()=>{const a=R(4,8)*100+R(20,90),b=R(2,4)*100+R(20,90);
    const ra=Math.round(a/100)*100, rb=Math.round(b/100)*100;
    return{q:`Estimate before you calculate: ${a} + ${b}.`,steps:[
      {kind:'input',instruct:`Round ${a} to the nearest hundred.`,ans:ra},
      {kind:'input',instruct:`Round ${b} to the nearest hundred.`,ans:rb},
      {kind:'input',instruct:'What is the exact sum?',ans:a+b}
    ],why:`Estimate: ${ra} + ${rb} = ${ra+rb}. Exact: ${a} + ${b} = ${a+b}. The estimate tells you the exact answer is in the right neighborhood.`};}
];

/* ---------- MODULE 3 : units of 0,1,6,7,8,9 and beyond ---------- */
const M3=[
  ()=>{const a=pick([6,7,8,9]),b=pick([11,12]);
    return{q:`${a} × ${b} is past the facts you have memorized. Break the ${b} into ${b===11?'10 and 1':'10 and 2'}.`,steps:[
      {kind:'array',instruct:`Draw the first piece: the part that uses 10.`,need:{rows:a,cols:10,total:a*10},max:{r:9,c:12}},
      {kind:'array',instruct:`Draw the second piece: the part that is left over.`,need:{rows:a,cols:b-10,total:a*(b-10)},max:{r:9,c:4}},
      {kind:'input',instruct:`Add the two pieces together. ${a} × ${b} = ?`,ans:a*b}
    ],why:`${a} × ${b} = (${a} × 10) + (${a} × ${b-10}) = ${a*10} + ${a*(b-10)} = ${a*b}.`};},

  ()=>{const rows=pick([6,7,8]),per=pick([7,8,9]),tot=rows*per,eaten=R(6,14);
    return{q:`A tray of brownies is cut into ${rows} rows with ${per} brownies in each row. ${eaten} are eaten at the party.`,steps:[
      {kind:'array',instruct:'Draw the array of brownies.',need:{rows:rows,cols:per,total:tot},max:{r:9,c:9}},
      {kind:'input',instruct:'How many brownies were on the tray?',ans:tot},
      {kind:'input',instruct:'How many are left?',ans:tot-eaten}
    ],why:`${rows} × ${per} = ${tot} brownies, then ${tot} − ${eaten} = ${tot-eaten} left.`};},

  ()=>{const per=pick([6,7,8,9]),rows=pick([6,7,8,9]),tot=per*rows;
    return{q:`${tot} photos are arranged in equal rows with ${per} photos in each row.`,steps:[
      {kind:'array',instruct:'Draw the array of photos.',need:{rows:rows,cols:per,total:tot},max:{r:10,c:9}},
      {kind:'input',instruct:'How many rows are there?',ans:rows},
      {kind:'choice',instruct:'Which equation did you just solve?',
       ...mcText(`${tot} ÷ ${per} = ${rows}`,[`${tot} ÷ ${rows} = ${per}`,`${per} × ${rows} = ${tot}`,`${tot} − ${per} = ${tot-per}`])}
    ],why:`You knew the total (${tot}) and the size of each row (${per}), and found how many rows: ${tot} ÷ ${per} = ${rows}.`};},

  ()=>{const boxes=pick([4,6,7,8]),per=pick([20,30,40,50]);
    return{q:`A warehouse has ${boxes} crates. Each crate holds ${per} cans.`,steps:[
      {kind:'input',instruct:`Start with the easy fact: ${boxes} × ${per/10} = ?`,ans:boxes*per/10},
      {kind:'input',instruct:`Now use it. How many cans in all?`,ans:boxes*per},
      {kind:'input',instruct:`${R(30,90)>0?'':''}Half the crates are shipped out. How many cans leave the warehouse?`,ans:boxes*per/2}
    ],why:`${boxes} × ${per/10} = ${boxes*per/10}, so ${boxes} × ${per} = ${boxes*per} cans. Half of ${boxes*per} is ${boxes*per/2}.`};},

  ()=>{const b=pick([6,7,8]),c=pick([9,12]);
    return{q:`Compare two totals: ${b} groups of ${c}, and ${c} groups of ${b}.`,steps:[
      {kind:'array',instruct:`Draw ${b} rows of ${c}.`,need:{rows:b,cols:c,total:b*c},max:{r:9,c:12}},
      {kind:'input',instruct:`How many in all?`,ans:b*c},
      {kind:'choice',instruct:`Without drawing again — how many are in ${c} rows of ${b}?`,
       ...mcText(`${b*c}, the same`,[`${b+c}`,`${b*c*2}`,`There is no way to tell`])}
    ],why:`${b} × ${c} = ${c} × ${b} = ${b*c}. Turning the array on its side does not change how many there are, so you never have to redraw it.`};},

  ()=>{const weeks=pick([4,5,6,8]),perDay=pick([2,3]);
    const days=weeks*7, tot=days*perDay;
    return{q:`Someone reads ${perDay} chapters every day for ${weeks} weeks.`,steps:[
      {kind:'input',instruct:`How many days is ${weeks} weeks? (7 days in a week)`,ans:days},
      {kind:'input',instruct:'How many chapters is that in all?',ans:tot}
    ],why:`${weeks} × 7 = ${days} days, and ${days} × ${perDay} = ${tot} chapters. Two multiplications, one after the other.`};}
];

/* ---------- MODULE 4 : multiplication and area ---------- */
const M4=[
  ()=>{const w=pick([4,5,6]),l=pick([7,8,9]),area=w*l;
    return{q:`A rug covers ${area} square feet of floor. It is ${w} feet wide.`,steps:[
      {kind:'array',instruct:'Draw the rug as a rectangle of square units.',need:{rows:w,cols:l,total:area},max:{r:7,c:10}},
      {kind:'input',instruct:'How long is the rug, in feet?',ans:l},
      {kind:'input',instruct:'What is the perimeter of the rug, in feet?',ans:2*(w+l)}
    ],why:`${w} × ___ = ${area}, so the length is ${l} feet. Perimeter walks the edge: ${l} + ${w} + ${l} + ${w} = ${2*(w+l)} feet.`};},

  ()=>{const h=pick([3,4,5]),a=pick([4,5,6]),b=pick([3,4]);
    return{q:`A garden is made of two rectangular beds side by side. Both are ${h} feet deep. One is ${a} feet wide, the other is ${b} feet wide.`,steps:[
      {kind:'array',instruct:'Draw the first bed.',need:{rows:h,cols:a,total:h*a},max:{r:6,c:8}},
      {kind:'array',instruct:'Draw the second bed.',need:{rows:h,cols:b,total:h*b},max:{r:6,c:6}},
      {kind:'input',instruct:'What is the total area of the garden, in square feet?',ans:h*(a+b)}
    ],why:`${h} × ${a} = ${h*a} and ${h} × ${b} = ${h*b}. Together that is ${h*(a+b)} square feet — the same as ${h} × ${a+b}, because the beds share a depth.`};},

  ()=>{const w=pick([3,4,5]),l=pick([6,7,8]);
    return{q:`A sandbox is ${l} feet long and ${w} feet wide. Sand covers the bottom; a wooden edge runs around the outside.`,steps:[
      {kind:'array',instruct:'Draw the sandbox as a rectangle of square units.',need:{rows:w,cols:l,total:w*l},max:{r:6,c:9}},
      {kind:'input',instruct:'How many square feet of sand cover the bottom?',ans:w*l},
      {kind:'input',instruct:'How many feet of wood run around the outside?',ans:2*(w+l)}
    ],why:`Sand fills the inside, so that is area: ${l} × ${w} = ${w*l} square feet. Wood goes around the edge, so that is perimeter: ${2*(w+l)} feet. Same rectangle, two different measurements.`};},

  ()=>{const s=pick([5,6,7,8]);
    return{q:`A square patio is ${s} feet on every side. Square tiles one foot across will cover it.`,steps:[
      {kind:'array',instruct:'Draw the patio as a square of tiles.',need:{rows:s,cols:s,total:s*s},max:{r:9,c:9}},
      {kind:'input',instruct:'How many tiles are needed?',ans:s*s},
      {kind:'input',instruct:`Tiles come in boxes of ${s}. How many boxes are needed?`,ans:s}
    ],why:`A ${s} by ${s} square needs ${s*s} tiles. At ${s} tiles per box, that is ${s*s} ÷ ${s} = ${s} boxes.`};},

  ()=>{const w=pick([4,6]),l=pick([6,8,9]),area=w*l;
    const w2=pick([3,5]),l2=Math.round(area/w2);
    return{q:`Two rectangles are being compared. The first is ${l} feet by ${w} feet. The second is ${l2} feet by ${w2} feet.`,steps:[
      {kind:'array',instruct:'Draw the first rectangle.',need:{rows:w,cols:l,total:area},max:{r:7,c:10}},
      {kind:'input',instruct:'What is the area of the first rectangle?',ans:area},
      {kind:'input',instruct:'What is the area of the second rectangle?',ans:w2*l2}
    ],why:`First: ${l} × ${w} = ${area} square feet. Second: ${l2} × ${w2} = ${w2*l2} square feet. ${area===w2*l2?'They cover the same area even though their shapes differ.':(area>w2*l2?'The first is larger by '+(area-w2*l2)+' square feet.':'The second is larger by '+(w2*l2-area)+' square feet.')}`};},

  ()=>{const w=pick([3,4,5]),l=pick([7,8,9]),area=w*l,cost=pick([2,3]);
    return{q:`A wall is ${l} feet long and ${w} feet tall. Paint covers one square foot for $${cost}.`,steps:[
      {kind:'array',instruct:'Draw the wall as a rectangle of square units.',need:{rows:w,cols:l,total:area},max:{r:6,c:10}},
      {kind:'input',instruct:'How many square feet is the wall?',ans:area},
      {kind:'input',instruct:'How many dollars will the paint cost?',ans:area*cost}
    ],why:`Area = ${l} × ${w} = ${area} square feet. At $${cost} each, that is ${area} × ${cost} = $${area*cost}.`};}
];

/* ---------- MODULE 5 : fractions as numbers ---------- */
const M5=[
  ()=>{const d=pick([6,8]),eaten=R(2,4),left=d-eaten;
    return{q:`A loaf of bread is cut into ${d} equal slices. ${eaten} slices are eaten.`,steps:[
      {kind:'frac',instruct:'Shade the bar to show the slices that are LEFT.',need:{d:d,n:left}},
      {kind:'choice',instruct:'What fraction of the loaf is left?',
       ...mcText(frac(left,d),[frac(eaten,d),frac(d,left),frac(left,d+1)])},
      {kind:'choice',instruct:'What fraction was eaten?',
       ...mcText(frac(eaten,d),[frac(left,d),frac(d,eaten),frac(eaten,d+2)])}
    ],why:`${d} equal slices, ${eaten} eaten, so ${left} are left. Left: ${left}/${d}. Eaten: ${eaten}/${d}. The two fractions add to ${d}/${d}, the whole loaf.`};},

  ()=>{const d=pick([3,4,6,8]),n=R(2,d-1);
    return{q:`A runner is ${n}/${d} of the way along a ${d}-part trail.`,steps:[
      {kind:'frac',instruct:`Shade the bar to show how far the runner has gone.`,need:{d:d,n:n}},
      {kind:'nline',instruct:'Now mark that same distance on the number line from 0 to 1.',
       min:0,max:1,step:1/d,majors:[0,1],labMin:'0',labMax:'1',need:{v:n/d},fmt:v=>`${Math.round(v*d)}/${d}`},
      {kind:'choice',instruct:'What fraction of the trail is still ahead?',
       ...mcText(frac(d-n,d),[frac(n,d),frac(d,d-n),frac(d-n,d+1)])}
    ],why:`${n}/${d} is ${n} jumps of 1/${d} from zero. The rest of the trail is ${d-n}/${d}, because ${n}/${d} + ${d-n}/${d} = ${d}/${d} = 1 whole trail.`};},

  ()=>{let d1=pick([3,4,6,8]),d2=pick([3,4,6,8]);while(d2===d1)d2=pick([3,4,6,8]);
    const small=Math.min(d1,d2),big=Math.max(d1,d2);
    return{q:`Two identical candy bars. One is split among ${small} children, the other among ${big} children. Each child gets one piece.`,steps:[
      {kind:'frac',instruct:`Shade one child's share from the bar split ${small} ways.`,need:{d:small,n:1}},
      {kind:'frac',instruct:`Now shade one child's share from the bar split ${big} ways.`,need:{d:big,n:1}},
      {kind:'choice',instruct:'Which group of children gets more candy each?',
       ...mcText(`The group of ${small}`,[`The group of ${big}`,'Both get the same','It depends on the bar'])}
    ],why:`Splitting the same bar into ${big} pieces makes smaller pieces than splitting it into ${small}. So 1/${small} > 1/${big}. With the same numerator, the bigger denominator means the smaller piece.`};},

  ()=>{const d=pick([4,6,8]);let a=R(1,d-1),b=R(1,d-1);while(b===a)b=R(1,d-1);
    const hi=Math.max(a,b),lo=Math.min(a,b);
    return{q:`Two students each read part of the same book, measured in ${d}ths.`,steps:[
      {kind:'frac',instruct:`Shade ${frac(a,d)}.`,need:{d:d,n:a}},
      {kind:'frac',instruct:`Now shade ${frac(b,d)}.`,need:{d:d,n:b}},
      {kind:'choice',instruct:'Which student read more of the book?',
       ...mcText(`The one who read ${frac(hi,d)}`,[`The one who read ${frac(lo,d)}`,'They read the same amount'])},
      {kind:'choice',instruct:'How much more?',
       ...mcText(frac(hi-lo,d),[frac(hi+lo,d),frac(d-hi,d),frac(lo,d)])}
    ],why:`The pieces are the same size, so just count them: ${hi}/${d} > ${lo}/${d}. The difference is ${hi-lo}/${d}.`};},

  ()=>{const d=pick([2,3,4]),m=pick([2,3]),d2=d*m;
    return{q:`The same amount of a bar can be named two different ways.`,steps:[
      {kind:'frac',instruct:`Shade ${frac(1,d)}.`,need:{d:d,n:1}},
      {kind:'frac',instruct:`Now split the whole bar into ${d2} equal parts and shade the SAME amount.`,need:{d:d2,n:m}},
      {kind:'choice',instruct:'What did the two bars show?',
       ...mcText(`${frac(1,d)} = ${frac(m,d2)}`,[`${frac(1,d)} > ${frac(m,d2)}`,`${frac(1,d)} < ${frac(m,d2)}`,`${frac(1,d)} = ${frac(1,d2)}`])}
    ],why:`Cutting each of the ${d} parts into ${m} gives ${d2} parts, and the shaded piece becomes ${m} of them. Same amount, different name: 1/${d} = ${m}/${d2}.`};},

  ()=>{const d=pick([3,4,6,8]),extra=R(1,d-1);
    return{q:`Pies are cut into ${d} equal slices each. Someone serves ${d+extra} slices.`,steps:[
      {kind:'frac',instruct:`First shade one whole pie: all ${d} slices.`,need:{d:d,n:d}},
      {kind:'input',instruct:`How many whole pies were completely used up?`,ans:1},
      {kind:'choice',instruct:`So ${d+extra} slices is how much pie?`,
       ...mcText(`1 whole and ${frac(extra,d)}`,[`${frac(d+extra,d+extra)}`,`${extra} wholes`,`${frac(extra,d)} only`])}
    ],why:`${d}/${d} = 1 whole pie. ${d+extra} slices is that whole pie plus ${extra} more slices, so 1 and ${extra}/${d}.`};}
];

/* ---------- MODULE 6 : geometry, measurement, data ---------- */
const M6=[
  ()=>{const w=pick([4,5,6]),l=pick([7,8,9]),area=w*l;
    return{q:`A dog pen covers ${area} square meters. One side measures ${w} meters. Fencing runs around the outside.`,steps:[
      {kind:'array',instruct:'Draw the pen as a rectangle of square units.',need:{rows:w,cols:l,total:area},max:{r:7,c:10}},
      {kind:'input',instruct:'How long is the other side, in meters?',ans:l},
      {kind:'input',instruct:'How many meters of fencing are needed?',ans:2*(w+l)}
    ],why:`${w} × ___ = ${area}, so the other side is ${l} m. Fencing is perimeter: ${l} + ${w} + ${l} + ${w} = ${2*(w+l)} m.`};},

  ()=>{const sh=R(1,9),sm=pick([20,25,35,40,45,50]),add=pick([35,40,50,55]);
    let tm=sm+add,th=sh+Math.floor(tm/60);tm=tm%60;
    const f=(h,m)=>`${h>12?h-12:h}:${String(m).padStart(2,'0')}`;
    return{q:`A movie starts at ${f(sh,sm)} and runs for ${add} minutes.`,steps:[
      {kind:'input',instruct:`How many minutes from ${f(sh,sm)} until ${f(sh+1,0)}?`,ans:60-sm},
      {kind:'input',instruct:`How many minutes are left over after reaching ${f(sh+1,0)}?`,ans:add-(60-sm)},
      {kind:'choice',instruct:'What time does the movie end?',
       ...mcText(f(th,tm),[f(th,(tm+15)%60),f(th+1,tm),f(sh,(sm+add)%60)])}
    ],why:`From ${f(sh,sm)} it is ${60-sm} minutes to ${f(sh+1,0)}. That leaves ${add-(60-sm)} more minutes, ending at ${f(th,tm)}.`};},

  ()=>{const h=R(1,12),m=pick([5,10,20,25,35,40,50,55]);
    const t=`${h}:${String(m).padStart(2,'0')}`,face=clockFig(h,m);
    return{q:`Read the clock, then work forward from it.`,steps:[
      {kind:'choice',instruct:'What time does the clock show?',fig:face,
       ...mcText(t,[`${h}:${String((m+5)%60).padStart(2,'0')}`,`${h===12?1:h+1}:${String(m).padStart(2,'0')}`,`${m}:${String(h).padStart(2,'0')}`])},
      {kind:'choice',instruct:'What time will it be 30 minutes later?',fig:face,
       ...(()=>{const nm=(m+30)%60,nh=m+30>=60?(h===12?1:h+1):h;const c=`${nh}:${String(nm).padStart(2,'0')}`;
          return mcText(c,[`${h}:${String(nm).padStart(2,'0')}`,`${nh}:${String((nm+5)%60).padStart(2,'0')}`,`${h}:${String((m+3)%60).padStart(2,'0')}`]);})()}
    ],why:`The short hand is past ${h} and the long hand is on ${m} minutes, so it reads ${t}. Thirty minutes later the minute hand moves halfway around${m+30>=60?', carrying the hour forward':''}.`};},

  ()=>{const info={
      square:['Square',4,'4 equal sides and 4 right angles'],
      rectangle:['Rectangle',4,'4 right angles with opposite sides equal'],
      rhombus:['Rhombus',4,'4 equal sides but no right angles'],
      trapezoid:['Trapezoid',4,'exactly one pair of parallel sides'],
      pentagon:['Pentagon',5,'5 sides and 5 corners'],
      hexagon:['Hexagon',6,'6 sides and 6 corners']};
    const k=pick(Object.keys(info)),o=info[k];
    const others=shuffle(Object.keys(info).filter(x=>x!==k)).slice(0,3);
    return{q:`A shape has ${o[2]}.`,steps:[
      {kind:'input',instruct:'How many sides does it have?',ans:o[1]},
      {kind:'choice',instruct:'What is the shape called?',...mcText(o[0],others.map(x=>info[x][0]))},
      {kind:'choice',instruct:'Is this shape a quadrilateral?',
       ...mcText(o[1]===4?'Yes — it has exactly 4 sides':'No — a quadrilateral must have exactly 4 sides',
         o[1]===4?['No — quadrilaterals must have right angles','No — quadrilaterals must have equal sides','Only if all sides match']
                 :['Yes — all closed shapes are quadrilaterals','Yes — it has straight sides','Only if it has right angles'])}
    ],why:`A ${o[0].toLowerCase()} has ${o[1]} sides — ${o[2]}. Quadrilateral means exactly 4 sides, so a ${o[0].toLowerCase()} ${o[1]===4?'is':'is not'} one.`};},

  ()=>{const cats=['Mon','Tue','Wed','Thu'],scale=pick([5,10]);
    const vals=cats.map(()=>R(2,8)*scale),tot=vals.reduce((a,b)=>a+b,0);
    const i=vals.indexOf(Math.max(...vals)),j=vals.indexOf(Math.min(...vals));
    const g=barGraphFig(cats,vals,scale,'minutes');
    return{q:`Minutes of reading logged over four days. Each gridline is ${scale} minutes.`,steps:[
      {kind:'input',instruct:`How many minutes were read on ${cats[i]}?`,fig:g,ans:vals[i]},
      {kind:'input',instruct:`How many more minutes on ${cats[i]} than on ${cats[j]}?`,fig:g,ans:vals[i]-vals[j]},
      {kind:'input',instruct:'How many minutes across all four days?',fig:g,ans:tot},
      {kind:'input',instruct:'How many minutes short of a 300 minute goal?',fig:g,ans:Math.max(0,300-tot)}
    ],why:`${cats[i]} was tallest at ${vals[i]}, which is ${vals[i]-vals[j]} more than ${cats[j]}'s ${vals[j]}. All four days: ${vals.join(' + ')} = ${tot}, leaving ${Math.max(0,300-tot)} minutes to reach 300.`};},

  ()=>{const a=R(6,14),b=R(6,14),per=pick([40,44,48,52]);
    const known=a+b, third=per-known;
    return{q:`A triangular flower bed has a perimeter of ${per} feet. Two of its sides measure ${a} feet and ${b} feet.`,steps:[
      {kind:'input',instruct:`Add the two known sides: ${a} + ${b} = ?`,ans:known},
      {kind:'input',instruct:'How long is the third side, in feet?',ans:third}
    ],why:`Perimeter is every side added: ${a} + ${b} = ${known}, and ${per} − ${known} = ${third} feet for the third side.`};}
];

  {id:'m3',n:3,name:'Hard Facts Hollow',short:'Hard Facts',topic:'Facts through 12 by breaking them apart, plus two-step problems you draw first',color:'#8A5A12',dark:'#E8B23F',bank:M3},
  {id:'m4',n:4,name:'Square Unit Flats',short:'Square Units',topic:'Missing sides from area, composite gardens, and area against perimeter in the same problem',color:'#5B7A1E',dark:'#A9CB63',bank:M4},
  {id:'m5',n:5,name:'Fraction Falls',short:'Fractions',topic:'Shade what a story asks for, move it to the number line, compare and find the difference',color:'#7A2E63',dark:'#DE93C6',bank:M5},
  {id:'m6',n:6,name:'Surveyor’s Point',short:'Surveying',topic:'Perimeter with a missing side, elapsed time across the hour, and four-step graph reading',color:'#A8324A',dark:'#F0879C',bank:M6}
];
const QPER=6;

/* ============================================================
   STATE
   ============================================================ */
let progress={};
try{progress=JSON.parse(localStorage.getItem('unitranger.v3')||'{}');}catch(e){progress={};}
function save(){try{localStorage.setItem('unitranger.v3',JSON.stringify(progress));}catch(e){}}
const starsFor=s=>s>=6?3:s>=4?2:s>=2?1:0;
const view=document.getElementById('view');
const totalStars=()=>STATIONS.reduce((t,s)=>t+(progress[s.id]?.stars||0),0);
const paintTally=()=>{document.getElementById('totstars').textContent=totalStars();};
const starStr=n=>`<span class="stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(3-n)}</span></span>`;
function isDark(){
  const t=document.documentElement.getAttribute('data-theme');
  if(t==='dark')return true; if(t==='light')return false;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
}
const modColor=st=>`--mod:${isDark()?st.dark:st.color}`;

/* ============================================================
   MAP
   ============================================================ */
const NODES=[[70,210],[240,90],[410,220],[580,80],[750,200],[920,85]];
function renderMap(){
  const done=STATIONS.filter(s=>progress[s.id]?.stars>0).length;
  const nodes=STATIONS.map((st,i)=>{
    const p=progress[st.id],[x,y]=NODES[i];
    const pips=p?.stars?`<span class="pips">${'<span class="pip"></span>'.repeat(p.stars)}</span>`:'';
    return `<button class="node ${p?.stars?'done':''}" data-go="${st.id}" style="left:${x/10}%;top:${y/3}%" aria-label="Station ${st.n}, ${st.name}">${st.n}${pips}</button>
      <span class="maplabel" style="left:${x/10}%;top:calc(${y/3}% + ${y<140?42:-50}px)">${st.short}</span>`;
  }).join('');
  view.innerHTML=`<section>
    <div class="eyebrow" style="margin-bottom:8px">The trail &middot; ${done} of 6 stations stamped</div>
    <div class="mapwrap"><div class="mapinner">
      <svg class="trail" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M70 210 C 130 150, 180 90, 240 90 S 350 230, 410 220 S 520 80, 580 80 S 690 210, 750 200 S 860 85, 920 85" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
        <path d="M70 210 C 130 150, 180 90, 240 90 S 350 230, 410 220 S 520 80, 580 80 S 690 210, 750 200 S 860 85, 920 85" fill="none" stroke="var(--pine)" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-done/6}"/>
      </svg>${nodes}
    </div></div>
    <div class="grid">${STATIONS.map(st=>{const p=progress[st.id];
      return `<button class="station" data-go="${st.id}" style="${modColor(st)}">
        <span class="num">MODULE ${st.n}</span><h3>${st.name}</h3><p>${st.topic}</p>
        <span class="foot">${starStr(p?.stars||0)}<span class="best">${p?'best '+p.best+'/'+QPER:'not started'}</span></span>
      </button>`;}).join('')}</div>
  </section>`;
  paintTally();
}

/* ============================================================
   QUIZ ENGINE
   ============================================================ */
let Q=null;

function startStation(id){
  const st=STATIONS.find(s=>s.id===id);
  const bank=shuffle(st.bank),qs=[];
  for(let i=0;i<QPER;i++) qs.push(bank[i%bank.length]());
  Q={st,qs,qi:0,si:0,marks:[],clean:true,streak:0,misses:[],done:[],locked:false,entry:'',sR:0,sT:0};
  renderStep();
}

function renderStep(){
  const {st,qs,qi,si}=Q, q=qs[qi], step=q.steps[si];
  B = isBuild(step.kind) ? Object.assign({step},BUILDERS[step.kind].init(step)) : {step};

  const ticks=Array.from({length:QPER},(_,k)=>{
    const cls=k<Q.marks.length?(Q.marks[k]?'hit':'miss'):(k===qi?'now':'');
    return `<span class="tick ${cls}"></span>`;}).join('');

  const chips=q.steps.map((s,k)=>
    `<span class="stepchip ${k<si?'ok':k===si?'on':''}">Step ${k+1}</span>`).join('');

  const doneHTML=Q.done.map(d=>`<div class="done-step${d.ok===false?' bad':''}">
      <span class="lbl">STEP ${d.n}</span>
      <span><span class="val">${d.text}</span>${d.mini||''}${d.cap?`<div class="best" style="margin-top:4px">${d.cap}</div>`:''}</span>
    </div>`).join('');

  let body;
  if(isBuild(step.kind)){
    body=BUILDERS[step.kind].html(step)+
      `<div class="rowend" style="justify-content:center"><button class="btn wide" id="checkbtn" type="button">Check</button></div>`;
  } else if(step.kind==='input'){
    body=`<div class="entry">
      <div class="numout" id="numout">&nbsp;</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}
        <button type="button" data-k="del" aria-label="Delete">&#9003;</button>
        <button type="button" data-k="0">0</button>
        <button type="button" class="go" data-k="ok">Check</button>
      </div></div>`;
  } else {
    body=`<div class="choices">${step.choices.map((c,k)=>
      `<button class="choice" data-c="${k}" type="button"><span class="key">${k+1}</span><span>${c}</span></button>`).join('')}</div>`;
  }

  view.innerHTML=`<div class="panel" style="${modColor(st)}">
    <div class="qhead">
      <span class="mod">Module ${st.n} &middot; ${st.name}</span><span class="spacer"></span>
      ${Q.streak>=2?`<span class="streak">${Q.streak} clean in a row</span>`:''}
      <button class="ghost" data-back="1" type="button">Back to trail</button>
    </div>
    <div class="track">${ticks}</div>
    <div class="context">${q.q}</div>
    <div class="stepbar">${chips}</div>
    ${doneHTML}
    <div class="instruct">${step.instruct}</div>
    <div class="hintline">${step.hint||''}</div>
    ${step.fig?`<div class="figure">${step.fig}</div>`:''}
    ${body}
    <div id="fb"></div>
  </div>`;

  Q.locked=false; Q.entry='';
  if(isBuild(step.kind)){
    BUILDERS[step.kind].paint();
    BUILDERS[step.kind].wire();
    document.getElementById('checkbtn').addEventListener('click',checkBuild);
  }
}

function checkBuild(){
  if(Q.locked)return; Q.locked=true;
  const step=B.step, kit=BUILDERS[step.kind], ok=kit.ok(step), sol=solutionOf(step);
  Q.sT++; if(ok)Q.sR++; else Q.clean=false;
  Q.done.push({n:Q.si+1, ok, text: ok?kit.recap(step):`You drew ${kit.recap(step)} \u2014 correct was ${sol.text}`, mini: ok?kit.mini(step):sol.mini, cap: ok?'':'the correct drawing'});
  document.querySelectorAll('#abgrid .cell, .fbar .fseg, [data-adj], [data-tp], [data-dk], [data-fp]').forEach(el=>{
    if(el.tagName==='BUTTON') el.disabled=true;
  });
  const grid=document.getElementById('abgrid'); if(grid) grid.classList.add('ro');
  const cb=document.getElementById('checkbtn'); if(cb) cb.remove();
  const last=Q.si+1>=Q.qs[Q.qi].steps.length;
  document.getElementById('fb').innerHTML=`
    <div class="feedback ${ok?'':'no'}"><strong>${ok?'Correct.':'Not correct.'}</strong>
      ${ok?'':`The drawing needed to be <b>${sol.text}</b>.`}${sol.mini&&!ok?`<div style="margin-top:8px">${sol.mini}</div>`:''}
      ${last?'<div style="margin-top:8px">'+Q.qs[Q.qi].why+'</div>':''}</div>
    <div class="rowend"><button class="btn" id="next" type="button">${last?(Q.qi+1<QPER?'Next problem':'See your score'):'Next step'}</button></div>`;
  document.getElementById('next').focus();
}

function judgeAnswer(ok,chosen){
  if(Q.locked)return; Q.locked=true;
  const step=B.step;
  Q.sT++; if(ok)Q.sR++; else Q.clean=false;
  if(step.kind==='input'){
    const el=document.getElementById('numout');
    el.classList.add(ok?'right':'wrong');
    if(!ok) el.innerHTML=`${Q.entry} &rarr; ${step.ans}`;
    Q.done.push({n:Q.si+1,ok,text:ok?`Answered ${step.ans}`:`You answered ${Q.entry} — the answer was ${step.ans}`});
  } else {
    document.querySelectorAll('.choice').forEach((b,k)=>{
      b.disabled=true;
      if(k===step.answer)b.classList.add('right');
      else if(k===chosen)b.classList.add('wrong');
    });
    Q.done.push({n:Q.si+1,ok,text:ok?step.choices[step.answer]:`You chose ${step.choices[chosen]} — the answer was ${step.choices[step.answer]}`});
  }
  const last=Q.si+1>=Q.qs[Q.qi].steps.length;
    document.getElementById('fb').innerHTML=`
    <div class="feedback ${ok?'':'no'}"><strong>${ok?'Correct.':'Not correct.'}</strong>
      ${ok?'':`The answer was <b>${step.kind==='input'?step.ans:step.choices[step.answer]}</b>.`}
      ${last?'<div style="margin-top:8px">'+Q.qs[Q.qi].why+'</div>':''}</div>
    <div class="rowend"><button class="btn" id="next" type="button">${last?(Q.qi+1<QPER?'Next problem':'See your score'):'Next step'}</button></div>`;
  document.getElementById('next').focus();
}

function finishQuestion(){
  Q.marks.push(Q.clean);
  if(Q.clean)Q.streak++; else {Q.streak=0; Q.misses.push(Q.qs[Q.qi]);}
  Q.qi++; Q.si=0; Q.clean=true; Q.done=[];
  if(Q.qi>=QPER) return finishStation();
  renderStep();
}

function nextFromButton(){
  const last=Q.si+1>=Q.qs[Q.qi].steps.length;
  if(last) return finishQuestion();
  Q.si++; renderStep();
}

function finishStation(){
  const score=Q.marks.filter(Boolean).length, stars=starsFor(score), st=Q.st;
  const prev=progress[st.id]||{best:0,stars:0,plays:0};
  progress[st.id]={best:Math.max(prev.best,score),stars:Math.max(prev.stars,stars),plays:(prev.plays||0)+1};
  save();
  const pct=Q.sT?Math.round(Q.sR/Q.sT*100):0;
  const line=stars===3?'Every problem fully correct. Badge stamped.'
    :stars===2?'Solid — most problems fully correct.'
    :stars===1?'Some problems came apart partway through. The trail notes show where.'
    :'A hard run. Work through the trail notes before trying again.';
  view.innerHTML=`<div class="panel" style="${modColor(st)};text-align:center">
    <div class="eyebrow">Station ${st.n} complete</div>
    <div class="stamp"><svg viewBox="0 0 150 150" width="150" aria-hidden="true">
      <circle cx="75" cy="75" r="66" fill="none" stroke="var(--mod)" stroke-width="4"/>
      <circle cx="75" cy="75" r="57" fill="none" stroke="var(--mod)" stroke-width="1.5" stroke-dasharray="4 5"/>
      <text x="75" y="66" text-anchor="middle" fill="var(--mod)" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="40">${score}/${QPER}</text>
      <text x="75" y="92" text-anchor="middle" fill="var(--mod)" font-family="IBM Plex Mono,monospace" font-size="12" letter-spacing="2">MODULE ${st.n}</text>
    </svg></div>
    <div class="bigstars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <h2 style="font-size:26px;margin:10px 0 4px">${st.name}</h2>
    <p style="color:var(--muted);margin:0 0 2px">${line}</p>
    <p class="best" style="margin:0 0 4px">${Q.sR} of ${Q.sT} individual steps correct (${pct}%)</p>
    <div class="rowend" style="justify-content:center">
      <button class="btn" data-retry="${st.id}" type="button">Run it again</button>
      <button class="ghost" data-back="1" type="button">Back to trail</button>
    </div>
    ${Q.misses.length?`<div class="notes" style="text-align:left">
      <div class="eyebrow" style="margin-bottom:8px">Trail notes &middot; problems with a wrong step</div>
      ${Q.misses.map(m=>`<div class="note"><span class="mk">!</span><span class="body"><b>${m.q}</b><br>${m.why}</span></div>`).join('')}
    </div>`:`<div class="notes"><div class="eyebrow">Trail notes</div><p style="color:var(--muted);margin:8px 0 0">Every step correct. Nothing to review.</p></div>`}
  </div>`;
  paintTally();
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go)return startStation(go.dataset.go);
  if(e.target.closest('[data-back]'))return renderMap();
  const rt=e.target.closest('[data-retry]'); if(rt)return startStation(rt.dataset.retry);
  if(e.target.id==='next')return nextFromButton();
  const ch=e.target.closest('.choice');
  if(ch&&!ch.disabled)return judgeAnswer(+ch.dataset.c===B.step.answer,+ch.dataset.c);
  const pk=e.target.closest('.pad button'); if(pk)return padPress(pk.dataset.k);
});

function padPress(k){
  if(!Q||Q.locked)return;
  const el=document.getElementById('numout'); if(!el)return;
  if(k==='del')Q.entry=Q.entry.slice(0,-1);
  else if(k==='ok'){ if(Q.entry==='')return; return judgeAnswer(+Q.entry===B.step.ans,null); }
  else if(Q.entry.length<6)Q.entry+=k;
  el.textContent=Q.entry===''?' ':Q.entry;
}

document.addEventListener('keydown',e=>{
  if(!Q||!B)return;
  const n=document.getElementById('next');
  if(e.key==='Enter'){
    if(n){e.preventDefault();return nextFromButton();}
    if(B.step.kind==='input'){e.preventDefault();return padPress('ok');}
    if(isBuild(B.step.kind)){e.preventDefault();return checkBuild();}
  }
  if(Q.locked)return;
  const step=B.step;
  if(step.kind==='input'){
    if(/^[0-9]$/.test(e.key))padPress(e.key);
    else if(e.key==='Backspace')padPress('del');
  } else if(step.kind==='choice'&&/^[1-4]$/.test(e.key)){
    const k=+e.key-1; if(k<step.choices.length)judgeAnswer(k===step.answer,k);
  } else if(step.kind==='array'){
    const m={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];
    if(m){e.preventDefault();arraySet(B.rows+m[0],B.cols+m[1]);}
  }
});

document.getElementById('resetbtn').addEventListener('click',()=>{progress={};save();Q=null;B=null;renderMap();});

if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const flip=()=>{if(!Q)renderMap();};
  mq.addEventListener?mq.addEventListener('change',flip):mq.addListener(flip);
}
new MutationObserver(()=>{if(!Q)renderMap();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

renderMap();
</script>

</body>
</html>
